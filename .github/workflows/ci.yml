# Lints, type checks and tests cypher-guardrail on every pull request and every push to main.
# The checks are the ones publish.yml runs before it publishes a release.
#
# The tests run against FalkorDBLite (an embedded FalkorDB), which ships wheels for Python 3.12 and newer only, and the
# job `falkordb-server` runs them against a real FalkorDB server (a service container). tests/servers.py chooses the
# FalkorDB from CYPHER_GUARDRAIL_TEST_BACKEND.
# So the whole suite runs on 3.12, 3.13 and 3.14, and on the oldest supported Python, 3.11, only the tests that
# need no engine run (the others are skipped, and the log says so). The accuracy corpus (tests/accuracy/) is also
# measured there, and its table of precision and recall is in the log.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      CYPHER_GUARDRAIL_TEST_BACKEND: lite
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install the locked environment
        run: uv sync --locked

      - name: Lint, format, type check and test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check
          uv run lint-imports
          uv run python scripts/metrics.py --check
          uv run coverage run -m pytest
          uv run coverage report
          uv run python scripts/accuracy.py

  oldest-python:
    name: Python 3.11 (the tests that need no FalkorDBLite)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
      CYPHER_GUARDRAIL_TEST_BACKEND: lite
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install the locked environment
        run: uv sync --locked

      # The demo notebooks import FalkorDBLite, which is not installed here, so only the library and the tests are type checked.
      - name: Lint, format, type check and test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check src tests
          uv run pytest -rs

  # A real server, the image that FalkorDB publishes: the latest of 6 and of 4 (FalkorDBLite is FalkorDB 4.18).
  falkordb-server:
    name: FalkorDB ${{ matrix.image }} server (Python 3.12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["6.0.3", "v4.22.2"]
    env:
      UV_PYTHON: "3.12"
      CYPHER_GUARDRAIL_TEST_BACKEND: server
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"
    services:
      falkordb:
        image: falkordb/falkordb:${{ matrix.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install the locked environment
        run: uv sync --locked

      - name: Test
        run: uv run pytest -q
