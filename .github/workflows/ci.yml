# Lints, type checks and tests cypher-guardrail on every pull request and every push to main.
# The checks are the ones publish.yml runs before it publishes a release.
#
# The tests run against FalkorDBLite (an embedded FalkorDB), which ships wheels for Python 3.12 and newer only.
# So the whole suite runs on 3.12, 3.13 and 3.14, and on the oldest supported Python, 3.11, only the tests that
# need no engine run (the others are skipped, and the log says so). The accuracy corpus (tests/accuracy/) is also
# measured there, and its table of precision and recall is in the log.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install the locked environment
        run: uv sync --locked

      - name: Lint, format, type check and test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check
          uv run lint-imports
          uv run python scripts/metrics.py --check
          uv run coverage run -m pytest
          uv run coverage report
          uv run python scripts/accuracy.py

  oldest-python:
    name: Python 3.11 (the tests that need no FalkorDBLite)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install the locked environment
        run: uv sync --locked

      # The demo notebooks import FalkorDBLite, which is not installed here, so only the library and the tests are type checked.
      - name: Lint, format, type check and test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check src tests
          uv run pytest -rs
