[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[project]
name = "cypher-guardrail"
version = "1.1.1"
description = "Parse and validate cypher queries against a given FalkorDB Knowledge Graph schema. Validates query syntax, schema validity, and property access."
readme = "README.md"
authors = [{ name = "Killeroid" }]
dependencies = [
    "regex>=2024.11.6",
    "pandas>=2.2.3",
    "falkordb>=1.8.0",
    "redis>=8.0.0,<9",
]
requires-python = ">=3.11"
keywords = ["cypher", "FalkorDB", "validation", "parser", "graph", "database", "graphdb", "opencypher"]
classifiers=[
        'Programming Language :: Python :: 3',
        'Operating System :: OS Independent',
        'Intended Audience :: Developers',
        'Topic :: Software Development :: Libraries :: Python Modules',
]
license = "Apache-2.0"
license-files = ["LICENSE"]


[tool.uv.build-backend]
module-name = "cypher_guardrail"

[dependency-groups]
dev = [
    "falkordblite<0.11 ; python_full_version >= '3.12'",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-copybutton>=0.5.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.ty.environment]
python = ".venv"
# the corpus of tests/accuracy/ is imported by tests/test_accuracy.py and scripts/accuracy.py as `harness`
extra-paths = ["tests/accuracy"]

[tool.ty.analysis]
# FalkorDBLite is only installed on Python >= 3.12, but a test script imports it
allowed-unresolved-imports = ["redislite.**"]

[project.urls]
Homepage = "https://github.com/Killeroid/cypher-guardrail"
Documentation = "https://cypher-guardrail.readthedocs.io/en/latest/"
Changelog = "https://github.com/Killeroid/cypher-guardrail/blob/main/CHANGELOG.md"
Issues = "https://github.com/Killeroid/cypher-guardrail/issues"
Repository = "https://github.com/Killeroid/cypher-guardrail"
