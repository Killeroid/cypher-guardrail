[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[project]
name = "cypher-guardrail"
version = "1.1.1"
description = "Parse and validate cypher queries against a given FalkorDB Knowledge Graph schema. Validates query syntax, schema validity, and property access."
readme = "README.md"
authors = [{ name = "Killeroid" }]
dependencies = [
    "regex>=2024.11.6",
    "pandas>=2.2.3",
    "falkordb>=1.8.0",
    "redis>=8.0.0,<9",
]
requires-python = ">=3.11"
keywords = ["cypher", "FalkorDB", "validation", "parser", "graph", "database", "graphdb", "opencypher"]
classifiers=[
        'Programming Language :: Python :: 3',
        'Operating System :: OS Independent',
        'Intended Audience :: Developers',
        'Topic :: Software Development :: Libraries :: Python Modules',
]
license = "Apache-2.0"
license-files = ["LICENSE"]


[tool.uv.build-backend]
module-name = "cypher_guardrail"

[dependency-groups]
dev = [
    "falkordblite<0.11 ; python_full_version >= '3.12'",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "sphinx-copybutton>=0.5.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = ["ANN", "ARG", "B", "C4", "C90", "I", "PERF", "PIE", "PLR", "PT", "RET", "RUF", "SIM", "TC", "UP"]
ignore = ["PT018"]  # an assertion with `and` is one claim; splitting it only repeats the message

# Ratchets of the refactoring plan: they stand at the worst function today and only go down (target in each comment).
[tool.ruff.lint.mccabe]
max-complexity = 20  # target 10

[tool.ruff.lint.pylint]
max-branches = 23  # target 12
max-statements = 53  # target 50
max-args = 11  # target 5
max-positional-args = 8  # target 5
max-returns = 7  # target 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG", "PLR0913", "PLR0917", "PLR2004"]
# The modules that are not typed yet. The list only gets shorter: take a module out when it is fully annotated.
"src/cypher_guardrail/backend.py" = ["ANN"]
"src/cypher_guardrail/live.py" = ["ANN"]
"src/cypher_guardrail/patterns.py" = ["ANN"]
"src/cypher_guardrail/snapshot.py" = ["ANN"]
"src/cypher_guardrail/utils.py" = ["ANN"]
"src/cypher_guardrail/validators/properties_validator.py" = ["ANN"]
"src/cypher_guardrail/validators/schema_validator.py" = ["ANN"]
"src/cypher_guardrail/validators/syntax_validator.py" = ["ANN"]
"src/cypher_guardrail/_internal/core/errors.py" = ["ANN"]
"src/cypher_guardrail/_internal/core/io.py" = ["ANN"]
"src/cypher_guardrail/_internal/core/literals.py" = ["ANN"]
"src/cypher_guardrail/_internal/core/queries.py" = ["ANN"]
"src/cypher_guardrail/_internal/core/scopes.py" = ["ANN"]
"src/cypher_guardrail/_internal/core/valuetypes.py" = ["ANN"]
"src/cypher_guardrail/_internal/sources/capture.py" = ["ANN"]
"src/cypher_guardrail/_internal/sources/hybrid.py" = ["ANN"]
"src/cypher_guardrail/_internal/sources/offline.py" = ["ANN"]
"src/cypher_guardrail/_internal/sources/online.py" = ["ANN"]

[tool.ty.environment]
python = ".venv"
# the corpus of tests/accuracy/ is imported by tests/test_accuracy.py and scripts/accuracy.py as `harness`
extra-paths = ["tests/accuracy"]

[tool.ty.analysis]
# FalkorDBLite is only installed on Python >= 3.12, but a test script imports it
allowed-unresolved-imports = ["redislite.**"]

[project.urls]
Homepage = "https://github.com/Killeroid/cypher-guardrail"
Documentation = "https://cypher-guardrail.readthedocs.io/en/latest/"
Changelog = "https://github.com/Killeroid/cypher-guardrail/blob/main/CHANGELOG.md"
Issues = "https://github.com/Killeroid/cypher-guardrail/issues"
Repository = "https://github.com/Killeroid/cypher-guardrail"
